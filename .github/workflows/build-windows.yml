# Builds the Omni Windows installer on GitHub's free Windows machines.
# Runs on every push to main, or manually from the Actions tab ("Run workflow").
# The finished installer appears under the repo's Releases (and as a run artifact).
name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install JavaScript packages
        run: npm install

      - name: Build installer and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: omni-v__VERSION__
          releaseName: 'Omni v__VERSION__'
          releaseBody: 'Download **Omni_…_x64-setup.exe** below, run it, and follow the README.'
          releaseDraft: false
          prerelease: false

      - name: Keep a copy of the installer on the run page
        uses: actions/upload-artifact@v4
        with:
          name: Omni-Windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
