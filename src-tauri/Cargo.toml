[package]
name = "omni"
version = "0.3.0"
description = "Omni — a lightweight all-in-one app"
edition = "2021"

[lib]
name = "omni_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Recorder
cpal = "0.15"          # audio capture (WASAPI on Windows, incl. system-audio loopback)
nnnoiseless = "0.5"    # RNNoise AI noise suppression, pure Rust
flacenc = "0.4"        # lossless FLAC export, pure Rust

# Small, fast release binary.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Keep DSP fast even in debug builds.
[profile.dev.package."*"]
opt-level = 2
